spring:
  application:
    name: medicore-backend
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medicore}
    username: ${DB_USERNAME:medicore}
    password: ${DB_PASSWORD:medicore}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
    show-sql: false
  flyway:
    enabled: true
server:
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
medicore:
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  bootstrap:
    admin-email: ${MEDICORE_ADMIN_EMAIL:}
    admin-password: ${MEDICORE_ADMIN_PASSWORD:}
---
spring:
  config:
    activate:
      on-profile: test
